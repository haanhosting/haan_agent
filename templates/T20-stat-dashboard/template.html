<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T20 – Stat Gauge Dashboard</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t20 { background: #030817; color: #fff; }
    .canvas.neon.t20 .bg-image-layer { opacity: 0.2 !important; filter: grayscale(0.3) hue-rotate(-10deg); }
    .t20 .grid-lines {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0.35;
      background-image:
        linear-gradient(rgba(79,210,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,210,255,0.12) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 100%);
    }
    .canvas.neon.t20 > .mid { align-items: center; text-align: center; gap: 34px; }
    .canvas.neon.t20 h1 { font-size: 70px; text-align: center; }
    .t20 .gauge {
      position: relative; width: 420px; height: 420px; border-radius: 50%; flex: 0 0 auto;
      background: conic-gradient(from 220deg, #4fd2ff 0deg, #1e90ff 200deg, rgba(47,155,255,0.12) 200deg 280deg, transparent 280deg);
      box-shadow: 0 0 60px rgba(47,155,255,0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .t20 .gauge::before {
      content: ''; position: absolute; inset: 26px; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #0d2f78 0%, #050b1f 75%);
      border: 2px solid rgba(79,210,255,0.35);
    }
    .t20 .gauge-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 50px; }
    .t20 .stat-number { font-size: 104px; line-height: 1; }
    .t20 .stat-label {
      font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: 0.12em;
      text-transform: uppercase; color: #bfe7ff;
    }
    .t20 .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
    .t20 .tile {
      background: rgba(8,22,58,0.78); border: 2px solid rgba(64,160,255,0.55); border-radius: 18px;
      padding: 22px 18px; font-size: 26px; line-height: 1.3; color: #dbe7ff; font-weight: 600;
      display: flex; align-items: center; justify-content: center; min-height: 112px;
      box-shadow: inset 0 0 24px rgba(47,155,255,0.12);
    }
    .t20 .tile:nth-child(n+4) { display: none; }
  </style>
</head>
<body>
  <div class="canvas post t20 {{variantClass}}" style="{{cssVariables}}">
    <div class="bg-image-layer" style="{{bgImageStyle}}"></div>
    <div class="bg-vignette-layer"></div>
    <div class="grid-lines"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="gauge">
        <div class="gauge-inner">
          <div class="stat-number auto-shrink">{{priceBadge}}</div>
          {{#if statLabel}}<div class="stat-label">{{statLabel}}</div>{{/if}}
        </div>
      </div>
      <div class="tiles">
        {{#each bentoItems}}<div class="tile">{{this}}</div>{{/each}}
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

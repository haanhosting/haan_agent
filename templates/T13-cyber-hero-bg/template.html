<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T13 – Cyber Hero BG</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t13 {
      background: #050b1a;
      color: #f8fafc;
    }
    .t13 .bg-image-layer {
      opacity: 0.34 !important;
    }
    .t13 .mid {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .t13 .eyebrow-tag {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.16);
      border: 2px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      padding: 12px 28px;
      border-radius: 999px;
      font-family: Poppins, sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .t13 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 86px;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .t13 .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      border: 2px solid rgba(56, 189, 248, 0.42);
      border-left: 10px solid var(--accent, #38bdf8);
      border-radius: 28px;
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .t13 .glass-panel p {
      font-size: 38px;
      line-height: 1.38;
      color: #e2e8f0;
      margin: 0;
    }
    .t13 .glass-highlight {
      font-family: Poppins, sans-serif;
      font-size: 34px;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="canvas post t13 {{variantClass}}" style="{{cssVariables}}">
    <div class="bg-image-layer" style="{{bgImageStyle}}"></div>
    <div class="bg-vignette-layer"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <div class="eyebrow-tag">⚡ Enterprise NVMe Infrastructure</div>
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="glass-panel">
        <p class="auto-shrink">{{subline}}</p>
        {{#if highlight}}<div class="glass-highlight"><span>✦</span> {{highlight}}</div>{{/if}}
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T06 - Quote Card</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t06-container {
      display: flex;
      flex-direction: column;
      gap: 36px;
      flex: 1;
      justify-content: center;
      margin: 30px 0;
    }

    .t06-quote-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 55px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: relative;
    }

    .t06-quote-icon {
      width: 72px;
      height: 72px;
      fill: var(--accent);
      opacity: 0.9;
    }

    .t06-quote-text {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .t06-author-row {
      display: flex;
      align-items: center;
      gap: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 24px;
    }

    .t06-avatar-mark {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
    }

    .t06-author-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .t06-author-name {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
    }

    .t06-author-role {
      font-size: 20px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Variant 1: Centered luxury quote */
    .variant-1 .t06-quote-box {
      text-align: center;
      align-items: center;
    }
    .variant-1 .t06-author-row {
      justify-content: center;
    }

    /* Variant 2: Left accent border */
    .variant-2 .t06-quote-box {
      border-left: 8px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t06-container">
        <div class="t06-quote-box">
          <svg class="t06-quote-icon" viewBox="0 0 24 24">
            <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
          </svg>

          <div class="t06-quote-text auto-shrink">“{{headline}}”</div>

          <div class="t06-author-row">
            <div class="t06-avatar-mark">⚡</div>
            <div class="t06-author-meta">
              <div class="t06-author-name">{{author}}</div>
              <div class="t06-author-role">{{role}}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

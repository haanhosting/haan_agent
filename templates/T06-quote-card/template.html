<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T06 – Quote Card</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t06 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t06 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t06 .mid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .t06 .quote-mark {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 140px;
      line-height: 0.7;
      color: var(--accent);
    }
    .t06 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 76px;
      line-height: 1.15;
      color: var(--ink);
      margin: 0;
    }
    .t06 .bar {
      height: 16px;
      width: 160px;
      background: var(--accent);
      margin: 12px 0;
    }
    .t06 .author {
      font-size: 40px;
      font-weight: 500;
      color: var(--muted);
    }
    .t06 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t06 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <div class="quote-mark">“</div>
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="bar"></div>
      {{#if author}}<div class="author">{{author}}{{#if role}} · {{role}}{{/if}}</div>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T18 – VIP Promo Poster</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t18 {
      background: #040817;
      color: #ffffff;
    }
    .t18 .bg-image-layer {
      opacity: 0.36 !important;
    }
    .t18 .mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }
    .t18 .hero-crest {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.45);
      object-fit: cover;
    }
    .t18 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 76px;
      line-height: 1.12;
      color: #ffffff;
    }
    .t18 .price-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(14, 165, 233, 0.85));
      border: 2px solid #7dd3fc;
      border-radius: 999px;
      padding: 18px 52px;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 46px;
      color: #ffffff;
      box-shadow: 0 16px 40px rgba(14, 165, 233, 0.35);
    }
    .t18 .promo-sub {
      background: rgba(15, 23, 42, 0.82);
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 32px 42px;
      font-size: 36px;
      line-height: 1.36;
      color: #e2e8f0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="canvas post t18 {{variantClass}}" style="{{cssVariables}}">
    <div class="bg-image-layer" style="{{bgImageStyle}}"></div>
    <div class="bg-vignette-layer"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <img class="hero-crest" src="{{logoDataUri}}" alt="Haan Hosting Crest" />
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="price-banner">{{priceBadge}}</div>
      {{#if subline}}<div class="promo-sub auto-shrink">{{subline}}</div>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

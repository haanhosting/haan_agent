<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T04 – Big Number</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t04 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t04 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t04 .mid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .t04 .stat-number {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 148px;
      line-height: 1.15;
      padding-bottom: 8px;
      color: var(--accent);
    }
    .t04 .stat-label {
      font-size: 36px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .t04 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 76px;
      line-height: 1.12;
      color: var(--ink);
      margin: 0;
    }
    .t04 p {
      font-size: 40px;
      line-height: 1.35;
      color: var(--muted);
      margin: 0;
    }
    .t04 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t04 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <div>
        <div class="stat-number auto-shrink">{{statNumber}}</div>
        <div class="stat-label">{{statLabel}}</div>
      </div>
      <h1 class="auto-shrink">{{headline}}</h1>
      {{#if subline}}<p class="auto-shrink">{{subline}}</p>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

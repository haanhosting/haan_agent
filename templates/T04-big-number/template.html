<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T04 - Big Number</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t04-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      flex: 1;
      text-align: center;
      margin: 30px 0;
    }

    .t04-number-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .t04-giant-number {
      font-family: var(--font-display);
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 15px 30px rgba(37, 99, 235, 0.35));
    }

    .t04-number-label {
      font-family: var(--font-code);
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent2);
    }

    .t04-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 44px 50px;
      max-width: 860px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .t04-headline {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
    }

    .t04-body-text {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
    }

    /* Variant 1: Left aligned */
    .variant-1 .t04-container {
      align-items: flex-start;
      text-align: left;
    }
    .variant-1 .t04-number-wrap {
      align-items: flex-start;
    }

    /* Variant 2: Card enclosing everything */
    .variant-2 .t04-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 50px;
    }
    .variant-2 .t04-card {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t04-container">
        <div class="t04-number-wrap">
          <div class="t04-giant-number auto-shrink">{{statNumber}}</div>
          <div class="t04-number-label">{{statLabel}}</div>
        </div>

        <div class="t04-card">
          <div class="t04-headline auto-shrink">{{headline}}</div>
          <div class="t04-body-text auto-shrink">{{body}}</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

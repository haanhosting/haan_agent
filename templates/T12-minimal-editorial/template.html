<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T12 – Minimal Editorial</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t12 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t12 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t12 .mid {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .t12 .thin-rule {
      height: 8px;
      width: 160px;
      background: var(--accent);
    }
    .t12 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 88px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t12 p {
      font-size: 40px;
      line-height: 1.38;
      color: var(--muted);
      margin: 0;
      padding-left: 32px;
      border-left: 6px solid var(--accent);
    }
    .t12 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t12 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <div class="thin-rule"></div>
      <h1 class="auto-shrink">{{headline}}</h1>
      {{#if subline}}<p class="auto-shrink">{{subline}}</p>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

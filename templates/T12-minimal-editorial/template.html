<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T12 - Minimal Editorial</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t12-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      flex: 1;
      justify-content: center;
      margin: 30px 0;
    }

    .t12-editorial-rule {
      width: 100px;
      height: 3px;
      background: var(--accent);
    }

    .t12-headline {
      font-family: var(--font-display);
      font-size: 68px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #ffffff;
      max-width: 900px;
    }

    .t12-body-block {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 840px;
    }

    .t12-body-text {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--muted);
      border-left: 2px solid rgba(255, 255, 255, 0.15);
      padding-left: 30px;
    }

    .t12-takeaway-tag {
      font-family: var(--font-code);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Variant 1: Centered balanced editorial */
    .variant-1 .t12-container {
      align-items: center;
      text-align: center;
    }
    .variant-1 .t12-body-text {
      border-left: none;
      padding-left: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 24px;
    }

    /* Variant 2: Elevated card frame */
    .variant-2 .t12-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 60px;
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t12-container">
        <div class="t12-editorial-rule"></div>
        <div class="t12-headline auto-shrink">{{headline}}</div>

        <div class="t12-body-block">
          <div class="t12-takeaway-tag">{{editorialTag}}</div>
          <div class="t12-body-text auto-shrink">{{body}}</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T09 - Terminal / Code</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t09-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
      flex: 1;
      justify-content: center;
      margin: 20px 0;
    }

    .t09-headline {
      font-family: var(--font-display);
      font-size: 58px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .t09-terminal-window {
      background: #050811;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      font-family: var(--font-code);
    }

    .t09-terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #0d1322;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .t09-terminal-dots {
      display: flex;
      gap: 8px;
    }

    .t09-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .t09-dot-red { background: #ff5f56; }
    .t09-dot-yellow { background: #ffbd2e; }
    .t09-dot-green { background: #27c93f; }

    .t09-terminal-title {
      font-size: 18px;
      color: #64748b;
    }

    .t09-terminal-body {
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    .t09-line-command {
      color: #ffffff;
      display: flex;
      gap: 12px;
    }

    .t09-prompt {
      color: var(--accent2);
      font-weight: 700;
    }

    .t09-line-output {
      color: #94a3b8;
      padding-left: 24px;
    }

    .t09-line-success {
      color: var(--accent2);
      font-weight: 700;
      padding-left: 24px;
    }

    .t09-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 30px;
      backdrop-filter: blur(16px);
      font-size: 26px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
    }

    /* Variant 1: Left accent bar */
    .variant-1 .t09-terminal-window {
      border-left: 6px solid var(--accent);
    }

    /* Variant 2: Terminal Glow */
    .variant-2 .t09-terminal-window {
      box-shadow: 0 0 45px rgba(0, 187, 127, 0.2);
      border-color: var(--accent2);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t09-container">
        <div class="t09-headline auto-shrink">{{headline}}</div>

        <div class="t09-terminal-window">
          <div class="t09-terminal-header">
            <div class="t09-terminal-dots">
              <span class="t09-dot t09-dot-red"></span>
              <span class="t09-dot t09-dot-yellow"></span>
              <span class="t09-dot t09-dot-green"></span>
            </div>
            <div class="t09-terminal-title">{{terminalTitle}}</div>
            <div></div>
          </div>

          <div class="t09-terminal-body">
            <div class="t09-line-command">
              <span class="t09-prompt">$</span>
              <span>{{command}}</span>
            </div>
            <div class="t09-line-output">{{output}}</div>
            {{#if successLine}}
            <div class="t09-line-success">✔ {{successLine}}</div>
            {{/if}}
          </div>
        </div>

        {{#if body}}
        <div class="t09-card auto-shrink">{{body}}</div>
        {{/if}}
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T09 – Terminal</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t09 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t09 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t09 .mid {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .t09 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 76px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t09 .term-box {
      background: #0B132B;
      color: #E2E8F0;
      border-radius: 24px;
      padding: 44px 48px;
      font-family: 'Space Grotesk', monospace;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .t09 .cmd {
      font-size: 38px;
      font-weight: 600;
      color: #FFFFFF;
    }
    .t09 .cmd span {
      color: #38BDF8;
      margin-right: 12px;
    }
    .t09 .out {
      font-size: 34px;
      line-height: 1.4;
      color: #94A3B8;
      white-space: pre-wrap;
    }
    .t09 .ok {
      font-size: 36px;
      font-weight: 600;
      color: #4ADE80;
    }
    .t09 p {
      font-size: 38px;
      line-height: 1.35;
      color: var(--muted);
      margin: 0;
    }
    .t09 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t09 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="term-box">
        <div class="cmd"><span>$</span>{{command}}</div>
        <div class="out">{{output}}</div>
        {{#if successLine}}<div class="ok">✓ {{successLine}}</div>{{/if}}
      </div>
      {{#if subline}}<p class="auto-shrink">{{subline}}</p>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

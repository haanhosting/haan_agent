<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T05 - Offer Poster</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t05-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      flex: 1;
      justify-content: center;
      margin: 20px 0;
    }

    .t05-headline-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .t05-headline {
      font-family: var(--font-display);
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .t05-offer-card {
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 44px 50px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(37, 99, 235, 0.25);
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .t05-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 22px;
    }

    .t05-plan-title {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
    }

    .t05-price {
      font-family: var(--font-display);
      font-size: 54px;
      font-weight: 900;
      color: var(--accent);
    }

    .t05-specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .t05-spec-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 22px;
      font-weight: 600;
      color: #f8fafc;
    }

    .t05-spec-pill .check {
      color: var(--accent2);
      font-weight: 900;
    }

    .t05-cta-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    /* Variant 1: Single column specs */
    .variant-1 .t05-specs-grid {
      grid-template-columns: 1fr;
    }

    /* Variant 2: Solid accent border glow */
    .variant-2 .t05-offer-card {
      background: linear-gradient(145deg, rgba(37, 99, 235, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      box-shadow: 0 0 50px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t05-container">
        <div class="t05-headline-wrap">
          <div class="t05-headline auto-shrink">{{headline}}</div>
        </div>

        <div class="t05-offer-card">
          <div class="t05-price-row">
            <div class="t05-plan-title">{{planName}}</div>
            <div class="t05-price">{{price}}</div>
          </div>

          <div class="t05-specs-grid">
            {{#each specs}}
            <div class="t05-spec-pill">
              <span class="check">✓</span>
              <span>{{this}}</span>
            </div>
            {{/each}}
          </div>

          <div class="t05-cta-wrap">
            <div class="cta-button">
              <span>{{ctaButtonText}}</span>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

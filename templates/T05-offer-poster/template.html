<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T05 – Offer Poster</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t05 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t05 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t05 .mid {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .t05 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 76px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t05 .offer-box {
      background: var(--card);
      color: var(--cardInk);
      border-radius: 24px;
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .t05 .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 24px;
      border-bottom: 3px solid var(--accent);
    }
    .t05 .plan-name {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 44px;
      color: var(--cardInk);
    }
    .t05 .price {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 56px;
      color: var(--accent);
    }
    .t05 .specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 28px;
      font-size: 36px;
      color: var(--cardInk);
    }
    .t05 .specs div span {
      color: var(--accent);
      font-weight: 600;
      margin-right: 10px;
    }
    .t05 .cta-pill {
      display: inline-block;
      align-self: flex-start;
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 999px;
      padding: 20px 44px;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 36px;
    }
    .t05 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t05 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="offer-box">
        <div class="price-row">
          <div class="plan-name">{{planName}}</div>
          <div class="price">{{price}}</div>
        </div>
        <div class="specs">
          {{#each specs}}
          <div><span>✓</span>{{this}}</div>
          {{/each}}
        </div>
        {{#if ctaButtonText}}<div class="cta-pill">{{ctaButtonText}}</div>{{/if}}
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

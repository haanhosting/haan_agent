<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T11 – Carousel</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t11 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t11 .label {
      font-size: 34px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .t11 .mid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .t11 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 78px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t11 .bar {
      height: 16px;
      width: 192px;
      background: var(--accent);
    }
    .t11 p {
      font-size: 40px;
      line-height: 1.35;
      color: var(--muted);
      margin: 0;
    }
    .t11 ul {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: grid;
      gap: 18px;
    }
    .t11 li {
      background: var(--card);
      color: var(--cardInk);
      border-radius: 24px;
      padding: 26px 34px;
      font-size: 38px;
      line-height: 1.3;
    }
    .t11 li span {
      color: var(--accent);
      font-weight: 600;
      margin-right: 14px;
    }
    .t11 .footer {
      font-size: 34px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .t11 .swipe {
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="canvas post t11 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">
      <span>{{label}}</span>
      {{#if slideIndex}}<span>{{slideIndex}} / {{totalSlides}}</span>{{/if}}
    </div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="bar"></div>
      {{#if subline}}<p class="auto-shrink">{{subline}}</p>{{/if}}
      {{#if bullets}}
      <ul>
        {{#each bullets}}
        <li class="auto-shrink"><span>→</span> {{this}}</li>
        {{/each}}
      </ul>
      {{/if}}
    </div>
    <div class="footer">
      <span>Haan Hosting · {{cta}}</span>
      {{#if isCover}}<span class="swipe">Swipe →</span>{{/if}}
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T02 – Split Card</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t02 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t02 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t02 .mid {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }
    .t02 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 84px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t02 .card-box {
      background: var(--card);
      color: var(--cardInk);
      border-radius: 24px;
      padding: 48px 52px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .t02 .card-box p {
      font-size: 40px;
      line-height: 1.35;
      color: var(--cardInk);
      margin: 0;
    }
    .t02 .highlight {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 36px;
      color: var(--accent);
      padding-top: 20px;
      border-top: 3px solid var(--accent);
    }
    .t02 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t02 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="card-box">
        <p class="auto-shrink">{{subline}}</p>
        {{#if highlight}}<div class="highlight">{{highlight}}</div>{{/if}}
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

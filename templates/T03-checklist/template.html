<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T03 - Checklist</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t03-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
      justify-content: center;
      margin: 20px 0;
    }

    .t03-headline {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .t03-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .t03-item {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    }

    .t03-check-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(0, 187, 127, 0.15);
      border: 2px solid var(--accent2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .t03-check-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--accent2);
      stroke-width: 3;
      fill: none;
    }

    .t03-item-text {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.35;
    }

    /* Variant 1: Numbered Steps instead of checks */
    .variant-1 .t03-check-icon {
      background: rgba(37, 99, 235, 0.18);
      border-color: var(--accent);
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
    }

    /* Variant 2: Left accent bar */
    .variant-2 .t03-item {
      border-left: 6px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t03-container">
        <div class="t03-headline auto-shrink">{{headline}}</div>

        <div class="t03-list">
          {{#each items}}
          <div class="t03-item">
            <div class="t03-check-icon">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="t03-item-text auto-shrink">{{this}}</div>
          </div>
          {{/each}}
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

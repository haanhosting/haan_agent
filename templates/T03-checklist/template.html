<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T03 – Checklist</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t03 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t03 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t03 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 84px;
      line-height: 1.12;
      margin: 0 0 56px;
      color: var(--ink);
    }
    .t03 ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 22px;
    }
    .t03 li {
      background: var(--card);
      color: var(--cardInk);
      border-radius: 24px;
      padding: 30px 36px;
      font-size: 40px;
      line-height: 1.3;
    }
    .t03 li span {
      color: var(--accent);
      font-weight: 600;
      margin-right: 14px;
    }
    .t03 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t03 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <ul>
        {{#each items}}
        <li class="auto-shrink"><span>✓</span> {{this}}</li>
        {{/each}}
      </ul>
    </div>
    <div class="footer">{{cta}}</div>
  </div>
</body>
</html>

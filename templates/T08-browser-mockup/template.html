<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T08 – Browser Mockup</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t08 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t08 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t08 .mid {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }
    .t08 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 78px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t08 .browser {
      background: var(--card);
      color: var(--cardInk);
      border-radius: 24px;
      border: 3px solid var(--accent);
      overflow: hidden;
    }
    .t08 .browser-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 36px;
      border-bottom: 3px solid var(--accent);
    }
    .t08 .dots {
      display: flex;
      gap: 10px;
    }
    .t08 .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--accent);
    }
    .t08 .url {
      font-size: 34px;
      font-weight: 500;
      color: var(--accent);
    }
    .t08 .browser-body {
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .t08 .browser-title {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 46px;
      line-height: 1.2;
      color: var(--cardInk);
    }
    .t08 .browser-text {
      font-size: 38px;
      line-height: 1.35;
      color: var(--cardInk);
    }
    .t08 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t08 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="browser">
        <div class="browser-bar">
          <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="url">https://{{urlDomain}}</div>
        </div>
        <div class="browser-body">
          {{#if contentTitle}}<div class="browser-title auto-shrink">{{contentTitle}}</div>{{/if}}
          <div class="browser-text auto-shrink">{{subline}}</div>
        </div>
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

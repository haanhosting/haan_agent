<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T08 - Browser Mockup</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t08-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      flex: 1;
      justify-content: center;
      margin: 20px 0;
    }

    .t08-headline {
      font-family: var(--font-display);
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .t08-browser-frame {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }

    .t08-browser-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .t08-dots {
      display: flex;
      gap: 8px;
    }

    .t08-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .t08-dot-red { background: #ff5f56; }
    .t08-dot-yellow { background: #ffbd2e; }
    .t08-dot-green { background: #27c93f; }

    .t08-url-bar {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: var(--font-code);
      font-size: 18px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .t08-url-bar .lock {
      color: var(--accent2);
    }

    .t08-browser-content {
      padding: 44px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .t08-content-title {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }

    .t08-content-body {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
    }

    .t08-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-code);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
    }

    /* Variant 1: Centered Browser Window */
    .variant-1 .t08-container {
      align-items: center;
      text-align: center;
    }

    /* Variant 2: Accent Border Frame */
    .variant-2 .t08-browser-frame {
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t08-container">
        <div class="t08-headline auto-shrink">{{headline}}</div>

        <div class="t08-browser-frame">
          <div class="t08-browser-topbar">
            <div class="t08-dots">
              <span class="t08-dot t08-dot-red"></span>
              <span class="t08-dot t08-dot-yellow"></span>
              <span class="t08-dot t08-dot-green"></span>
            </div>
            <div class="t08-url-bar">
              <span class="lock">🔒</span> https://{{urlDomain}}
            </div>
          </div>

          <div class="t08-browser-content">
            <div class="t08-status-tag">
              <span>●</span> {{statusText}}
            </div>
            <div class="t08-content-title auto-shrink">{{contentTitle}}</div>
            <div class="t08-content-body auto-shrink">{{body}}</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

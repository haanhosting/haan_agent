<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T01 – Bold statement</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t01 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t01 .label {
      font-size: 34px;
      color: var(--accent2, var(--muted));
    }
    .t01 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 104px;
      line-height: 1.12;
      margin: 0;
      color: var(--ink);
    }
    .t01 .bar {
      height: 16px;
      width: 192px;
      background: var(--accent);
      margin: 44px 0;
    }
    .t01 p {
      font-size: 42px;
      line-height: 1.35;
      color: var(--muted);
      margin: 0;
    }
    .t01 .footer {
      font-size: 34px;
      color: var(--accent2, var(--muted));
    }
  </style>
</head>
<body>
  <div class="canvas post t01 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{headline}}</h1>
      <div class="bar"></div>
      {{#if subline}}<p class="auto-shrink">{{subline}}</p>{{/if}}
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

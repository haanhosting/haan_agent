<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T01 - Bold Statement</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .t01-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 36px;
      flex: 1;
      margin: 40px 0;
    }

    .t01-headline {
      font-family: var(--font-display);
      font-size: 74px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #ffffff;
      max-width: 900px;
    }

    .t01-headline .highlight {
      color: var(--accent);
      position: relative;
      display: inline-block;
    }

    .t01-headline .highlight::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      height: 8px;
      background: var(--accent2);
      border-radius: 4px;
      opacity: 0.8;
      z-index: -1;
    }

    .t01-subtext-card {
      background: var(--card);
      border-left: 6px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 36px 44px;
      max-width: 860px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .t01-subtext {
      font-size: 32px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
    }

    /* Variant 1: Centered */
    .variant-1 .t01-body {
      align-items: center;
      text-align: center;
    }
    .variant-1 .t01-subtext-card {
      border-left: none;
      border-top: 4px solid var(--accent);
      border-radius: var(--radius);
      text-align: center;
    }

    /* Variant 2: Elevated Contrast with Card Container */
    .variant-2 .t01-body {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 60px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="canvas {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="content-layer">
      <!-- Header -->
      <div class="brand-header">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>{{badge}}</span>
        </div>
        <div class="pill-tag">{{category}}</div>
      </div>

      <!-- Main Body -->
      <div class="t01-body">
        <div class="t01-headline auto-shrink">{{headline}}</div>
        {{#if body}}
        <div class="t01-subtext-card">
          <div class="t01-subtext auto-shrink">{{body}}</div>
        </div>
        {{/if}}
      </div>

      <!-- Footer -->
      <div class="brand-footer">
        <div class="brand-logo-wrap">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2zm0 4h16v-2H4v2zm0 4h16v-2H4v2z"/></svg>
          </div>
          <div class="brand-logo-text">HAAN<span>HOSTING</span></div>
        </div>
        <div class="brand-footer-cta">
          <span class="dot">●</span> {{cta}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>

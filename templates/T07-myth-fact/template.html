<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T07 – Myth vs fact</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t07 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t07 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t07 .mid {
      display: grid;
      gap: 28px;
    }
    .t07 .box {
      border-radius: 24px;
      padding: 48px 52px;
    }
    .t07 .box small {
      display: block;
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .t07 .box b {
      display: block;
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 64px;
      line-height: 1.15;
    }
    .t07 .myth {
      background: #F5C4B3;
      color: #4A1B0C;
    }
    .t07 .myth small {
      color: #712B13;
    }
    .t07 .fact {
      background: #C0DD97;
      color: #173404;
    }
    .t07 .fact small {
      color: #27500A;
    }
    .t07 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t07 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <div class="box myth">
        <small>Myth</small>
        <b class="auto-shrink">{{myth}}</b>
      </div>
      <div class="box fact">
        <small>Fact</small>
        <b class="auto-shrink">{{fact}}</b>
      </div>
    </div>
    <div class="footer">Haan Hosting · {{cta}}</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T10 – Poll / question</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .post.t10 {
      width: 1080px;
      height: 1350px;
      padding: 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, sans-serif;
    }
    .t10 .label {
      font-size: 34px;
      color: var(--muted);
    }
    .t10 h1 {
      font-family: Poppins, sans-serif;
      font-weight: 600;
      font-size: 84px;
      line-height: 1.12;
      margin: 0 0 56px;
      color: var(--ink);
    }
    .t10 .pill {
      border: 3px solid var(--accent);
      border-radius: 999px;
      padding: 24px 40px;
      font-size: 42px;
      color: var(--cardInk, var(--muted));
      margin-bottom: 22px;
    }
    .t10 .footer {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas post t10 {{variantClass}}" style="{{cssVariables}}">
    <div class="decoration-layer" style="{{decorationStyle}}"></div>
    <div class="label">{{label}}</div>
    <div class="mid">
      <h1 class="auto-shrink">{{question}}</h1>
      {{#each pillOptions}}
      <div class="pill auto-shrink">{{this}}</div>
      {{/each}}
    </div>
    <div class="footer">{{cta}}</div>
  </div>
</body>
</html>

name: Weekly Instagram Token Refresh

on:
  # Scheduled refresh disabled: the publisher uses a Meta system-user token (EAA…)
  # that never expires. Re-enable the schedule only if you switch to a 60-day IG… token.
  workflow_dispatch:

permissions:
  contents: write

# Shared by every workflow that commits state/ so they never race each other.
concurrency:
  group: haan-state-writer
  cancel-in-progress: false

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh Long-Lived Token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx src/cli.ts refresh-token

      - name: Commit token metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/token.json
          if git diff --staged --quiet; then
            echo "No token metadata changes to commit."
          else
            git commit -m "chore(security): refresh instagram token metadata [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            [ "${pushed:-0}" = "1" ] || { echo "::error::git push failed after 3 attempts"; exit 1; }
          fi

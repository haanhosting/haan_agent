name: Publish Due Instagram Posts

on:
  schedule:
    # Runs every 15 minutes to catch due posts promptly
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish Due Posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: npx tsx src/cli.ts publish

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ media/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(agent): update publishing queue and history [skip ci]"
            git push origin main
          fi

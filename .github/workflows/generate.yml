name: Nightly Content Generation & Rendering

on:
  schedule:
    # 19:30 UTC = 00:30 PKT (Asia/Karachi UTC+5)
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared by every workflow that commits state/ so they never race each other.
concurrency:
  group: haan-state-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate and Render Daily Posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://haan-agent.pages.dev' }}
        run: npx tsx src/cli.ts generate --render

      - name: Render any other unrendered posts (e.g. created from the dashboard)
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://haan-agent.pages.dev' }}
        run: npx tsx src/cli.ts render

      - name: Commit rendered media and updated queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/ state/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(agent): generate and render daily posts"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            [ "${pushed:-0}" = "1" ] || { echo "::error::git push failed after 3 attempts"; exit 1; }
          fi
